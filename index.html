<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoopCitricus | Cooperativa dos Citricultores do Estado da Bahia</title>
    <meta name="description" content="CoopCitricus – Cooperativa dos Citricultores do Estado da Bahia. Fortalecendo produtores de laranja através do cooperativismo, comercialização da produção e parcerias.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==========================================================================
           DESIGN SYSTEM & CSS VARIABLES
           ========================================================================== */
        :root {
            --bg-primary: #011F0B;
            --bg-secondary: #141C17;
            --green-primary: #1F9134;
            --green-secondary: #309044;
            --green-dark: #194522;
            --orange: #FD9005;
            --white: #FFFFFF;
            --text-primary: #F2F5F3;
            --text-secondary: #949C95;
            --border: rgba(48, 144, 68, 0.25);
            
            --font-title: 'Bebas Neue', sans-serif;
            --font-body: 'Montserrat', sans-serif;
            --transition-speed: 0.3s;
            --container-width: 1200px;
        }

        /* ==========================================================================
           BASE RESET & GLOBAL STYLES
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-body);
            line-height: 1.6;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-title);
            letter-spacing: 1px;
            font-weight: 400;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: all var(--transition-speed) ease;
        }

        ul {
            list-style: none;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .container {
            width: 100%;
            max-width: var(--container-width);
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ==========================================================================
           BUTTONS & UI COMPONENTS
           ========================================================================== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 28px;
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all var(--transition-speed) ease;
        }

        .btn-primary {
            background-color: var(--green-primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background-color: var(--green-secondary);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(31, 145, 52, 0.3);
        }

        .btn-orange {
            background-color: var(--orange);
            color: var(--bg-primary);
        }

        .btn-orange:hover {
            background-color: #e07f04;
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(253, 144, 5, 0.3);
        }

        .btn-outline {
            background-color: transparent;
            border-color: var(--green-primary);
            color: var(--white);
        }

        .btn-outline:hover {
            background-color: var(--green-primary);
            color: var(--white);
            transform: translateY(-2px);
        }

        .section-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-subtitle-tag {
            color: var(--orange);
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            display: block;
        }

        .section-title {
            font-size: 3rem;
            color: var(--white);
            margin-bottom: 15px;
            line-height: 1.1;
        }

        .section-description {
            color: var(--text-secondary);
            max-width: 650px;
            margin: 0 auto;
            font-size: 1.05rem;
        }

        /* ==========================================================================
           HEADER & NAVIGATION
           ========================================================================== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background-color: rgba(1, 31, 11, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            transition: all var(--transition-speed) ease;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 90px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        /* Logo SVG embutida */
        .logo-svg {
            height: 52px;
            width: auto;
            display: block;
        }

        .footer-brand .logo-svg {
            height: 40px;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-link {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-primary);
            position: relative;
            padding: 8px 0;
        }

        .nav-link:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 2px;
            background-color: var(--orange);
            transition: width var(--transition-speed) ease;
        }

        .nav-link:hover:after,
        .nav-link.active-link:after {
            width: 100%;
        }

        .nav-link.active-link {
            color: var(--white);
        }

        .hamburger {
            display: none;
            cursor: pointer;
            background: none;
            border: none;
            color: var(--white);
            font-size: 1.5rem;
        }

        /* ==========================================================================
           SPA SECTIONS CONTROLLER
           ========================================================================== */
        main {
            margin-top: 90px;
            flex: 1;
        }

        .page-section {
            display: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease-in-out;
            padding: 60px 0;
        }

        .page-section.active {
            display: block;
            opacity: 1;
            visibility: visible;
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==========================================================================
           1. HOME / HERO SECTION
           ========================================================================== */
        #home {
            padding: 0;
        }

        .hero {
            position: relative;
            min-height: calc(90vh - 90px);
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, rgba(1, 31, 11, 0.92) 0%, rgba(20, 28, 23, 0.75) 100%), 
                        url('https://images.unsplash.com/photo-1582979512210-99b6a53385f9?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            border-bottom: 1px solid var(--border);
        }

        .hero-content {
            max-width: 800px;
            padding: 40px 0;
        }

        .hero-tag {
            background-color: rgba(253, 144, 5, 0.15);
            color: var(--orange);
            border: 1px solid rgba(253, 144, 5, 0.3);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .hero-title {
            font-size: 4rem;
            line-height: 1.05;
            color: var(--white);
            margin-bottom: 20px;
        }

        .hero-title span {
            color: var(--orange);
        }

        .hero-description {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 35px;
            max-width: 650px;
        }

        .hero-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .scroll-indicator i {
            animation: bounce 2s infinite;
            color: var(--orange);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(8px); }
            60% { transform: translateY(4px); }
        }

        /* Differentials / Cards de Destaque na Home */
        .differentials-section {
            padding: 80px 0;
            background-color: var(--bg-primary);
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .diff-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 40px 30px;
            border-radius: 12px;
            transition: all var(--transition-speed) ease;
            position: relative;
            overflow: hidden;
        }

        .diff-card:hover {
            transform: translateY(-8px);
            border-color: var(--green-primary);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .diff-icon {
            width: 65px;
            height: 65px;
            background-color: rgba(31, 145, 52, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: var(--orange);
            margin-bottom: 25px;
            border: 1px solid rgba(253, 144, 5, 0.2);
        }

        .diff-card h3 {
            font-size: 1.8rem;
            color: var(--white);
            margin-bottom: 15px;
        }

        .diff-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* ==========================================================================
           2. A COOPERATIVA (INSTITUCIONAL)
           ========================================================================== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-top: 40px;
        }

        .stat-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-top: 4px solid var(--orange);
            padding: 35px 20px;
            text-align: center;
            border-radius: 8px;
        }

        .stat-number {
            font-family: var(--font-title);
            font-size: 3.5rem;
            color: var(--white);
            line-height: 1;
            margin-bottom: 10px;
        }

        .stat-label {
            color: var(--orange);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .institution-content {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            margin-bottom: 40px;
        }

        .info-list {
            margin-top: 25px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .info-item i {
            color: var(--green-primary);
            font-size: 1.2rem;
            margin-top: 4px;
        }

        .info-item p {
            color: var(--text-primary);
        }

        /* ==========================================================================
           3. AVISOS
           ========================================================================== */
        .notices-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-bottom: 40px;
        }

        .notice-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all var(--transition-speed) ease;
        }

        .notice-card:hover {
            border-color: var(--green-primary);
            transform: translateY(-5px);
        }

        .notice-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .notice-badge {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .badge-reuniao {
            background-color: rgba(253, 144, 5, 0.15);
            color: var(--orange);
            border: 1px solid rgba(253, 144, 5, 0.3);
        }

        .badge-comunicado {
            background-color: rgba(31, 145, 52, 0.15);
            color: var(--green-primary);
            border: 1px solid rgba(31, 145, 52, 0.3);
        }

        .badge-novidade {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .notice-date {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .notice-title {
            font-size: 1.5rem;
            color: var(--white);
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .notice-desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .center-btn {
            text-align: center;
        }

        /* ==========================================================================
           4. NOSSA PRODUÇÃO (SOMENTE LARANJA)
           ========================================================================== */
        .production-block {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .production-image {
            height: 100%;
            min-height: 400px;
            background: url('https://images.unsplash.com/photo-1557800636-894a64c1696f?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
        }

        .production-content {
            padding: 50px 40px 50px 0;
        }

        .production-content h3 {
            font-size: 2.5rem;
            color: var(--white);
            margin-bottom: 20px;
        }

        .production-content p {
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .production-list {
            margin-top: 25px;
        }

        .production-list li {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .production-list i {
            color: var(--orange);
        }

        /* ==========================================================================
           5. SEJA COOPERADO
           ========================================================================== */
        .coop-cta-card {
            background: linear-gradient(135deg, rgba(31, 145, 52, 0.15) 0%, rgba(20, 28, 23, 1) 100%);
            border: 1px solid var(--green-primary);
            border-radius: 12px;
            padding: 50px;
            text-align: center;
            margin-bottom: 50px;
        }

        .fees-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin: 40px 0;
        }

        .fee-box {
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 10px;
        }

        .fee-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .fee-value {
            font-family: var(--font-title);
            font-size: 3rem;
            color: var(--orange);
        }
